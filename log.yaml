version: 1
formatters:
  default:
    format: '%(asctime)s %(levelname)-8s %(name)-15s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
    level: INFO
  logfile:
    class : logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/runner.log
    maxBytes: 1024000
    backupCount: 3
    level: DEBUG
loggers:
  unit_pipeline:
    level: DEBUG
    # handlers: [console]
    # propagate: no
  runner:
    level: DEBUG
root:
  level: DEBUG
  handlers: [ console, logfile ]