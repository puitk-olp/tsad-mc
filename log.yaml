version: 1
formatters:
  default:
    format: '%(asctime)s %(levelname)-8s %(name)-15s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
    level: DEBUG
#   unit_logfile:
#     class : logging.handlers.RotatingFileHandler
#     formatter: default
#     filename: logs/unit-pipeline.log
#     maxBytes: 1024000
#     backupCount: 3
#     level: DEBUG
#   runner_logfile:
#     class : logging.handlers.RotatingFileHandler
#     formatter: default
#     filename: logs/runner.log
#     maxBytes: 1024000
#     backupCount: 3
#     level: DEBUG
loggers:
  unit_pipeline:
    level: DEBUG
    # handlers: [ unit_logfile ]
    # propagate: yes
  runner:
    level: DEBUG
    # handlers: [ runner_logfile ]
root:
  level: INFO
  handlers: [ console ]